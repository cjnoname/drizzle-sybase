name: Release

on:
  push:
    branches:
      - main
  # Recovery: a release whose build or publish failed after release-please
  # created its tag is published by running this on the tag —
  # `gh workflow run release.yml --ref vX.Y.Z`. Only the release path runs (a
  # version already on the registry is not published again).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Step 1: release-please creates/updates a release PR.
  # When merged, it creates a GitHub release + tag and sets release_created=true.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # Nothing is published from a commit whose lint or type check fails. (The test
  # suite runs in native.yml, against each binary that is published.)
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm i
      - name: Lint and type check
        run: pnpm check

  # Step 2a: Canary — publish on every push except when release-please just created a release.
  canary:
    needs: [release-please, verify]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created != 'true' }}
    uses: ./.github/workflows/native.yml
    with:
      artifact-prefix: canary-

  canary-publish:
    needs: [release-please, canary]
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.release_created != 'true' }}
    runs-on: ubuntu-latest
    # One at a time. Runs reach this job in whatever order their builds end,
    # so the lock alone does not keep the tag from moving back: see "Still the
    # newest commit?" below. (A newer run waiting replaces an older one still
    # waiting, which is fine: only the newest needs publishing.)
    concurrency:
      group: canary-publish
      cancel-in-progress: false
    # Job-level permissions replace the workflow defaults, so contents: write
    # must be repeated here for the "Comment on commit" step.
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm i

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place native binaries
        run: |
          mkdir -p src/native
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            cp "artifacts/canary-${platform}/sybase_native.${platform}.node" "src/native/"
          done

      - name: Build TypeScript
        run: pnpm build

      - name: Copy .node files to dist
        run: |
          mkdir -p dist/native
          cp src/native/sybase_native.*.node dist/native/

      - name: Put the FreeTDS source in the package
        run: bash scripts/build.sh --fetch-source

      - name: Generate canary version
        id: canary_version
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          CANARY_VERSION="${CURRENT_VERSION}-canary.${TIMESTAMP}.${COMMIT_SHORT}"
          echo "version=${CANARY_VERSION}" >> "$GITHUB_OUTPUT"
          node -e "const p=require('./package.json');p.version='${CANARY_VERSION}';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      # After the version is set: what is checked is what is published.
      - name: Install and load the packed package
        run: bash scripts/smoke-package.sh

      # Under the lock: a run of an older commit, whose build ended after a
      # newer one's, must not move the canary tag back to it. Only main's tip
      # is published — the run of any newer commit publishes that one.
      - name: Still the newest commit?
        id: newest
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved on to $(git rev-parse --short origin/main): not publishing this older commit"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish canary to npm
        if: steps.newest.outputs.publish == 'true'
        # Auth comes from GitHub OIDC via npm trusted publishing — no NPM_TOKEN.
        # Requires the trusted publisher (this repo + release.yml) to be
        # registered on npmjs.com for the drizzle-sybase package.
        run: pnpm publish --tag canary --no-git-checks

      # Unauthenticated and polled — `sleep 30` + `npm view` reads the packument,
      # which is CDN-cached for 300s. See scripts/verify-published.ts.
      - name: Verify canary publish
        if: steps.newest.outputs.publish == 'true'
        run: node scripts/verify-published.ts "drizzle-sybase@${{ steps.canary_version.outputs.version }}"

      - name: Comment on commit
        if: steps.newest.outputs.publish == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // The publish already succeeded and was verified, so a transient
            // GitHub API failure here must not fail the job.
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `🚀 Canary version published: \`${{ steps.canary_version.outputs.version }}\`\n\nInstall with: \`npm install drizzle-sybase@canary\``
              });
            } catch (error) {
              core.warning(`Canary published, but commenting on the commit failed: ${error.message}`);
            }

  # Step 2b: Build all platforms for release.
  # (release-please is skipped when run on a tag: hence !cancelled() and the
  # results checked here.)
  build:
    needs: [release-please, verify]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')) }}
    uses: ./.github/workflows/native.yml

  # Step 3: Publish to npm with all platform binaries.
  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm i

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place native binaries
        run: |
          mkdir -p src/native
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            cp "artifacts/${platform}/sybase_native.${platform}.node" "src/native/"
          done

      - name: Build TypeScript
        run: pnpm build

      - name: Copy .node files to dist
        run: |
          mkdir -p dist/native
          cp src/native/sybase_native.*.node dist/native/

      - name: Put the FreeTDS source in the package
        run: bash scripts/build.sh --fetch-source

      - name: Install and load the packed package
        run: bash scripts/smoke-package.sh

      - name: Publish to npm
        # Auth comes from GitHub OIDC via npm trusted publishing — no NPM_TOKEN.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # A re-run after the publish succeeded but a later step failed: a
          # version cannot be published twice, so it is only verified below.
          if node scripts/verify-published.ts --exists "drizzle-sybase@${VERSION}"; then
            echo "drizzle-sybase@${VERSION} is already on the registry; not publishing it again"
            exit 0
          fi
          if echo "$VERSION" | grep -q "beta\|alpha\|rc"; then
            echo "Publishing ${VERSION} with --tag beta"
            pnpm publish --tag beta --no-git-checks
          elif ! LATEST=$(npm view drizzle-sybase dist-tags.latest) || [ -z "$LATEST" ]; then
            # Not knowing which version is latest, it must not be guessed.
            echo "Could not read the latest version from the registry" >&2
            exit 1
          elif ! node -e '
            const [a, b] = process.argv.slice(1).map(v => v.split(".").map(Number));
            const newer = a.findIndex((n, i) => n !== b[i]);
            process.exit(newer >= 0 && a[newer] > b[newer] ? 0 : 1);
          ' "$VERSION" "$LATEST"; then
            # An older release recovered after a newer one: latest stays where it is.
            echo "Publishing ${VERSION} with --tag previous (latest is newer)"
            pnpm publish --tag previous --no-git-checks
          else
            echo "Publishing ${VERSION} as latest"
            pnpm publish --no-git-checks
          fi

      # Unauthenticated and polled — see scripts/verify-published.ts.
      - name: Verify publish
        run: node scripts/verify-published.ts "drizzle-sybase@$(node -p "require('./package.json').version")"
